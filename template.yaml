AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CropPulse — Weather-Aware Irrigation Decision-Support System
  Environmental Hacks 2026 (Bharat Builds Tour - WeMakeDevs & AWS)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  # DynamoDB Table 1: Farm Profiles
  CropPulseFarmsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CropPulse-Farms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: farmId
          AttributeType: S
      KeySchema:
        - AttributeName: farmId
          KeyType: HASH

  # DynamoDB Table 2: Decision Logs & Environmental Ledger
  CropPulseDecisionLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CropPulse-DecisionLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: farmId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: farmId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # Serverless Compute Lambda Function
  CropPulseCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: croppulse-calculate-engine
      Handler: src/aws/lambdaHandler.handler
      Description: Deterministic FAO-56 Soil Water Balance and Resource-Constrained Feasibility Planner
      Environment:
        Variables:
          DYNAMODB_FARMS_TABLE: !Ref CropPulseFarmsTable
          DYNAMODB_LOGS_TABLE: !Ref CropPulseDecisionLogsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CropPulseFarmsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CropPulseDecisionLogsTable
      Events:
        CalculateApi:
          Type: HttpApi
          Properties:
            Path: /calculate
            Method: post

Outputs:
  CalculateApiUrl:
    Description: HTTP API endpoint URL for CropPulse calculation engine
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/calculate"
  FarmsTableName:
    Description: DynamoDB Farms Table Name
    Value: !Ref CropPulseFarmsTable
  LogsTableName:
    Description: DynamoDB Decision Logs Table Name
    Value: !Ref CropPulseDecisionLogsTable
